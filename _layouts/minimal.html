---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ site.language }}" class="no-js">
    {% include head.html %}
    <body class="has-push-menu">
        {% include svg-icons.html %}
        {% include header.html %}
        <div class="secondary-world-bg" aria-hidden="true">
            {% include pixel-world-scene.html scene="gallery" %}
        </div>
        <section class="post secondary-quest-shell">
            <article id="post" class="post-content fullwidth quest-dialog" role="main">
                <div class="pixel-window-bar quest-bar">
                    <span>{{ page.title | default: "标签" }}</span>
                    <a class="quest-back-btn" href="{{ site.baseurl }}/#world-quests">← 返回随笔</a>
                </div>
                <div class="quest-dialog-body">
                    {{ content }}
                </div>
            </article>
        </section>
        {% include footer.html %}
    </body>
</html>
