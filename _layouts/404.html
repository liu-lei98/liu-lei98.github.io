---
layout: default
---

<div class="secondary-world-bg" aria-hidden="true">
  {% include pixel-world-scene.html scene="home" %}
</div>

<div class="post secondary-quest-shell">
  <article class="post-content fullwidth quest-dialog">
    <div class="pixel-window-bar quest-bar">
      <span>页面不存在</span>
      <a class="quest-back-btn" href="{{ site.baseurl }}/#world-start">← 返回首页</a>
    </div>
    <div class="quest-dialog-body" style="text-align: center; padding: 36px 20px;">
      <div style="width: 96px; margin: 0 auto 14px;">
        {% include pixel-sprite.html theme="guide" %}
      </div>
      <h2 style="margin: 0 0 10px; color: #2a3358;">{{ site.translations.error_404.title | default: "404 · 没有找到这个页面" }}</h2>
      <p style="margin: 0 auto 20px; max-width: 420px; color: #5d6894;">{{ site.translations.error_404.message | default: "这个地址没有对应的页面。" }}</p>
      <a class="px-btn" href="{{ site.baseurl }}/#world-start">返回首页</a>
    </div>
  </article>
</div>
