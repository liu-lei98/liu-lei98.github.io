{% assign sprite = include.theme | default: "scholar" %}
{% if sprite == "avatar" %}
<svg class="pixel-sprite sprite-avatar" viewBox="0 0 18 18" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
  <!-- White pixel cat + scholar cap badge -->
  <rect x="2" y="2" width="3" height="3" fill="#232c4d"/>
  <rect x="13" y="2" width="3" height="3" fill="#232c4d"/>
  <rect x="3" y="3" width="2" height="2" fill="#ffffff"/>
  <rect x="13" y="3" width="2" height="2" fill="#ffffff"/>
  <rect x="4" y="4" width="1" height="1" fill="#ff9bb3"/>
  <rect x="13" y="4" width="1" height="1" fill="#ff9bb3"/>
  <rect x="2" y="5" width="14" height="10" fill="#232c4d"/>
  <rect x="3" y="5" width="12" height="9" fill="#ffffff"/>
  <rect x="3" y="12" width="12" height="2" fill="#e6eefc"/>
  <!-- Eyes & pink nose -->
  <rect x="5" y="8" width="2" height="2" fill="#232c4d"/>
  <rect x="11" y="8" width="2" height="2" fill="#232c4d"/>
  <rect x="5" y="8" width="1" height="1" fill="#ffffff"/>
  <rect x="11" y="8" width="1" height="1" fill="#ffffff"/>
  <rect x="8" y="10" width="2" height="1" fill="#ff7a95"/>
  <rect x="4" y="10" width="2" height="1" fill="#ffb8c9"/>
  <rect x="12" y="10" width="2" height="1" fill="#ffb8c9"/>
</svg>
{% elsif sprite == "guide" %}
<svg class="pixel-sprite sprite-guide" viewBox="0 0 36 32" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
  <!-- Ground shadow -->
  <rect x="3" y="29" width="16" height="2" fill="#2b571c" opacity="0.55"/>
  <rect x="21" y="29" width="12" height="2" fill="#2b571c" opacity="0.55"/>
  <!-- Dark-haired Researcher Boy with Backpack -->
  <rect x="6" y="2" width="10" height="2" fill="#232c4d"/>
  <rect x="5" y="4" width="12" height="4" fill="#2c3558"/>
  <rect x="7" y="3" width="5" height="2" fill="#465380"/>
  <rect x="6" y="8" width="10" height="6" fill="#f7cfa8"/>
  <rect x="8" y="10" width="2" height="2" fill="#232c4d"/>
  <rect x="13" y="10" width="2" height="2" fill="#232c4d"/>
  <rect x="8" y="10" width="1" height="1" fill="#ffffff"/>
  <rect x="13" y="10" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="13" width="3" height="1" fill="#d48a6a"/>
  <!-- Backpack -->
  <rect x="3" y="14" width="4" height="8" fill="#8b5a3c"/>
  <rect x="4" y="15" width="2" height="6" fill="#b57a52"/>
  <!-- Blue Hoodie & Scarf -->
  <rect x="6" y="14" width="11" height="8" fill="#3b6fd4"/>

  <rect x="7" y="22" width="4" height="5" fill="#5a4232"/>
  <rect x="12" y="22" width="4" height="5" fill="#5a4232"/>
  <rect x="7" y="27" width="4" height="2" fill="#232c4d"/>
  <rect x="12" y="27" width="4" height="2" fill="#232c4d"/>
  <!-- Companion White Cat on Right -->
  <rect x="23" y="18" width="2" height="2" fill="#232c4d"/>

  <rect x="24" y="19" width="1" height="1" fill="#ff9bb3"/>
  <rect x="29" y="19" width="1" height="1" fill="#ff9bb3"/>
  <rect x="23" y="20" width="8" height="8" fill="#ffffff"/>

  <rect x="25" y="22" width="1" height="2" fill="#232c4d"/>
  <rect x="29" y="22" width="1" height="2" fill="#232c4d"/>
  <rect x="27" y="24" width="1" height="1" fill="#ff7a95"/>
  <rect x="31" y="23" width="2" height="4" fill="#ffffff"/>
  <rect x="32" y="21" width="1" height="3" fill="#dce6f7"/>
</svg>
