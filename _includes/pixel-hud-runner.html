<div class="runner-dock" id="runner-dock" aria-label="冒险进度条">
  <div class="runner-nav">
    <a href="{{ site.baseurl }}/#world-start" data-jump="1-1" data-go-stage="0" class="is-active" data-i18n="nav.11">1-1 起点</a>
    <a href="{{ site.baseurl }}/#world-profile" data-jump="1-2" data-go-stage="1" data-i18n="nav.12">1-2 档案</a>
    <a href="{{ site.baseurl }}/#world-papers" data-jump="1-3" data-go-stage="2" data-i18n="nav.13">1-3 论文</a>
    <a href="{{ site.baseurl }}/#world-quests" data-jump="1-4" data-go-stage="3" data-i18n="nav.14">1-4 日志</a>
  </div>
  <div class="runner-track" id="runner-track" aria-hidden="true">
    <div class="runner-flags">
      <span class="flag" style="left: 5%">1-1</span>
      <span class="flag" style="left: 35%">1-2</span>
      <span class="flag" style="left: 65%">1-3</span>
      <span class="flag" style="left: 93%">1-4</span>
      <span class="flag flag-goal" id="runner-goal" style="left: 97%">⚑</span>
    </div>
    <div class="runner-hero" id="runner-hero">
      {% include pixel-sprite.html theme="guide" %}
    </div>
    <div class="runner-ground"></div>
  </div>
  <button type="button" class="warp-pipe" id="warp-top" title="传送水管：回到第一关" aria-label="回到第一关">▲ TOP</button>
</div>
<div class="pixel-toast-layer" id="pixel-toast-layer" aria-live="polite"></div>
<div class="pixel-curtain" id="pixel-curtain" aria-hidden="true"></div>
