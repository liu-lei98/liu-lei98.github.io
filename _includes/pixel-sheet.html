<div class="pixel-sheet">
  <div class="pixel-window-bar">
    <span>STATUS</span>
    <span>PLAYER 1</span>
  </div>
  <div class="pixel-sheet-body">
    <div class="pixel-portrait">
      <img src="{{ '/assets/img/uploads/profile.png' | prepend: site.baseurl }}" alt="Lei">
      {% include pixel-sprite.html %}
      <span class="pixel-nameplate">LEI</span>
    </div>
    <div class="pixel-sheet-text">
      <p class="hero-kicker">角色档案</p>
      <h1>Lei Liu</h1>
      <ul class="pixel-bars" aria-hidden="true">
        <li><span>HP</span><b><i class="hp"></i></b></li>
        <li><span>MP</span><b><i class="mp"></i></b></li>
        <li><span>EXP</span><b><i class="exp"></i></b></li>
      </ul>
      <dl class="pixel-facts">
        <dt>职业</dt>
        <dd>地球人</dd>
        <dt>所在</dt>
        <dd>地球</dd>
        <dt>状态</dt>

      <ul class="pixel-items">
        <li><a href="{{ site.baseurl }}/">回到地图</a></li>
        <li><a href="https://github.com/liu-lei98">GitHub</a></li>
        <li><a href="https://space.bilibili.com/3213366">Bilibili</a></li>
        <li><a href="{{ site.baseurl }}/contact/">送信</a></li>
      </ul>
    </div>
  </div>
</div>
